name: Squire
description: 'Squire is a barbershop management software platform that gives barbers and shop owners
  the tools to run their business: online booking and scheduling, client management and loyalty, integrated
  payment processing with same-day deposits, a custom-branded client mobile app, point-of-sale, inventory
  and business analytics. Booking is surfaced through Google, Instagram and Squire''s own consumer
  channels. Squire operates as a closed SaaS product with login-gated web and mobile applications; no
  public developer API, developer portal, OpenAPI specification, or partner/integration program is
  published as of this profile. Added to the API Evangelist network as a portfolio company of CRV,
  ICONIQ Capital and Trinity Ventures.'
